[project]
name = "storywright"
version = "0.1.0"
description = "LangGraph + Claude agent that turns user stories into verified Playwright API tests"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.16,<1.3",
    # 1.x is the documented, settled line; 2.0 shipped 2026-10-21 and is not adopted yet.
    "anthropic>=1.15,<2",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "mcp>=2.3,<3",
    "httpx>=0.28",
]

[project.scripts]
storywright = "storywright.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0", "mypy>=1.13.0", "types-pyyaml>=6.0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storywright"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# S602/S603/S607: runs the target repo's configured shell commands by design.
ignore = ["S602", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
